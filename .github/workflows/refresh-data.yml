name: Refresh AutoEq data

on:
    schedule:
        # Mondays at 06:00 UTC
        - cron: '0 6 * * 1'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: true

jobs:
    refresh:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write

        steps:
            - name: Checkout
              uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

            - name: Setup
              uses: ./.github/actions/setup

            - name: Generate catalog and profiles
              run: bun run generate

            - name: Run unit tests
              run: bun test

            - name: Open pull request
              uses: peter-evans/create-pull-request@v7
              with:
                  branch: refresh-autoeq-data
                  delete-branch: true
                  commit-message: 'chore: refresh AutoEq data'
                  title: 'chore: refresh AutoEq data'
                  body: |
                      Regenerates the catalog and profiles from the latest [AutoEq](https://github.com/jaakkopasanen/AutoEq) results.

                      Bump the version in `package.json` before publishing. Publishing uploads the new profiles to R2.
